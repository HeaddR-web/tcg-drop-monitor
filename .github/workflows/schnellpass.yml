name: Raffle-Schnellpass

# Laeuft dicht getaktet neben dem normalen Monitor und meldet NUR Zeitkritisches:
# Raffles, Live-Drops und frisch angelegte Ware. Alles andere laesst er bewusst
# liegen, damit der 15-Minuten-Lauf es weiterhin regulaer meldet.
# Grund fuer den dichten Takt: Raffles sind oft nur Stunden online, die zwei
# Feenturm-Raffles vom 10.08.2026 waren am selben Tag schon wieder verschwunden.

on:
  schedule:
    - cron: "*/5 7-21 * * *"    # alle 5 Min, 7:00-21:55 Ortszeit. Fenster 7-22 Uhr
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Dieselbe Gruppe wie monitor.yml: beide fahren monitor.py mit state.json.
  # Liefen sie parallel, koennten beide denselben frischen Treffer melden.
  # Seit 13.09.2026 (Befund Codex), vorher eigene Gruppe "schnellpass".
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # Spitze beim Start, nicht der Commit von der Einreihung (Konflikt 14.09.2026)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests beautifulsoup4

      - name: Schnellpass laufen lassen
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EILIG_ONLY: "1"
          # Nur die Katalog-Feeds: die liefern Anlage-Zeitpunkt und Beschreibung
          # mit, und nur darauf beruht die Erkennung von Tarnnamen und Fristen.
          SOURCES_ONLY: >-
            Feenturm (Katalog),GeeksHeaven (Katalog),CardCosmos (Katalog),ChiefCards (Katalog),Pokitrio (Katalog),CardsForAll (Katalog),Kartenbasis (Katalog),Kofuku (Katalog),Deckshop (Katalog)
        run: python monitor.py

      - name: State committen
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor@localhost"
          git add state.json last_run.txt || true
          git diff --staged --quiet && exit 0
          git commit -m "state update (schnellpass)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main || python3 scripts/state_vereinen.py; then
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "State-Push nach 5 Versuchen fehlgeschlagen" >&2
          exit 1   # sonst steht der Lauf gruen, obwohl das Gedaechtnis fehlt und der naechste Lauf doppelt meldet
