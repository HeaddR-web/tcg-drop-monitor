name: Takt

# Externer Taktgeber statt GitHub-Cron.
#
# Anlass 13.09.2026: GitHubs eigener "schedule"-Cron lieferte im oeffentlichen
# Repo nur 4 bis 6 Monitor-Laeufe pro Tag statt der geplanten 60 (gemessen mit
# `gh run list`, 01. bis 12.09.). Der Schnellpass (alle 5 Min geplant) kam auf
# 5 pro Tag. GitHub drosselt Cron-Laeufe bei Last, ohne Fehlermeldung.
#
# Loesung: cron-job.org ruft alle 5 Minuten die GitHub-API auf und startet
# diesen Workflow per workflow_dispatch (Endpunkt
# /actions/workflows/takt.yml/dispatches, Token braucht nur "Actions: write",
# kein Schreibrecht auf Dateien). Dieser Workflow startet dann die eigentlichen
# Workflows, ebenfalls per workflow_dispatch. Solche Starts unterliegen nicht
# der dokumentierten schedule-Verzoegerung, gemessen am 13.09.: Tick 19:54:11,
# Schnellpass und Bewertungen um 19:54:17 in der Warteschlange.
#
# Der Takt selbst ist ein einziger cron-job.org-Auftrag. Welche Workflows bei
# einem Tick starten, entscheidet die Minute:
#   Schnellpass und Bewertungen: bei jedem Tick (alle 5 Min)
#   Monitor:                     wenn die Minute in 0-4, 15-19, 30-34, 45-49 liegt
#   Drop-Radar:                  wenn die Minute in 0-4 liegt (einmal pro Stunde)
# Massgeblich ist die Minute, in der der Tick bei GitHub ankam (createdAt des
# Laufs), nicht die Minute, in der der Runner endlich startet. Sonst wuerde ein
# Tick um 21:00, dessen Runner erst 21:05 anlaeuft, den stuendlichen Drop-Lauf
# ersatzlos verlieren (Befund DeepSeek 13.09.2026). Faellt die Abfrage aus,
# gilt ersatzweise die Uhr des Runners.
# Kommt ein Tick selbst verspaetet an, kann ein Monitor-Lauf ausfallen
# (naechster in 15 Minuten) oder doppelt angestossen werden (der zweite wartet
# in der concurrency-Gruppe und findet nichts Neues). Beides ist verkraftbar.
#
# Kann der Takt einen Workflow nicht starten, meldet er das selbst per
# Telegram. cron-job.org sieht davon nichts: dessen Aufruf war schon mit 204
# beantwortet, bevor dieser Lauf begann.
#
# Die alten schedule-Eintraege in den Workflows bleiben als Rueckfall bestehen.
# Doppelte Starts stossen sich nicht: jeder Workflow hat eine concurrency-Gruppe,
# der zweite Lauf wartet und findet dann nichts Neues. Monitor und Schnellpass
# teilen sich EINE Gruppe, weil beide monitor.py mit state.json fahren; liefen
# sie parallel, koennten beide denselben frischen Treffer melden.
#
# Zeitfenster 7 bis 22 Uhr deutscher Zeit wird hier nochmal geprueft, in echter
# Ortszeit (Europe/Berlin, also auch nach der Zeitumstellung richtig). Wenn
# cron-job.org versehentlich rund um die Uhr feuert, passiert nachts nichts.

on:
  workflow_dispatch:          # von cron-job.org per API, oder von Hand zum Testen

permissions:
  actions: write              # noetig fuer `gh workflow run`
  contents: read

concurrency:
  group: takt
  cancel-in-progress: false

jobs:
  verteilen:
    runs-on: ubuntu-latest
    steps:
      - name: Workflows starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Zeitpunkt des Ticks = Anlage dieses Laufs, nicht Start des Runners.
          erstellt=$(gh run view "$GITHUB_RUN_ID" --json createdAt -q .createdAt || true)
          if [ -n "$erstellt" ]; then
            stunde=$(TZ=Europe/Berlin date -d "$erstellt" +%-H)
            minute=$(TZ=Europe/Berlin date -d "$erstellt" +%-M)
            echo "Tick angekommen (Berlin): $(TZ=Europe/Berlin date -d "$erstellt" '+%Y-%m-%d %H:%M:%S')"
          else
            stunde=$(TZ=Europe/Berlin date +%-H)
            minute=$(TZ=Europe/Berlin date +%-M)
            echo "createdAt nicht abrufbar, nehme Runner-Uhr."
          fi
          echo "Runner-Uhr (Berlin):      $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S')"

          if [ "$stunde" -lt 7 ] || [ "$stunde" -ge 22 ]; then
            echo "Ausserhalb des Fensters 7-22 Uhr, nichts gestartet."
            exit 0
          fi

          starten() {
            # Fehler beim Start nicht verschlucken, aber die anderen Workflows
            # trotzdem noch anstossen.
            if gh workflow run "$1"; then
              echo "gestartet: $1"
            else
              echo "START FEHLGESCHLAGEN: $1" >&2
              fehler=1
            fi
          }
          fehler=0

          starten schnellpass.yml
          starten feedback.yml

          if [ $((minute % 15)) -lt 5 ]; then
            starten monitor.yml
          else
            echo "Monitor nicht faellig (Minute $minute)"
          fi

          if [ "$minute" -lt 5 ]; then
            starten drops.yml
          else
            echo "Drop-Radar nicht faellig (Minute $minute)"
          fi

          exit $fehler

      - name: Bei Startfehler per Telegram melden
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram-Secrets fehlen, keine Meldung moeglich." >&2
            exit 0
          fi
          text="Takt konnte einen Workflow nicht starten. Log: $LAUF_URL"
          curl -sS --max-time 20 \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" > /dev/null \
            || echo "Telegram-Meldung fehlgeschlagen." >&2
