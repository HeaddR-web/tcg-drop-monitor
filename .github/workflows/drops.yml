name: Drop-Radar

on:
  schedule:
    - cron: "17 7-21 * * *"   # stuendlich (Minute 17), 7-21 Uhr Ortszeit. Fenster 7-22 Uhr
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Nie zwei Laeufe gleichzeitig: seit dem Takt (takt.yml) koennen Cron-
  # Rueckfall und externer Tick nah beieinander starten. Der zweite wartet.
  group: drops
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # Spitze beim Start, nicht der Commit von der Einreihung (Konflikt 14.09.2026)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests beautifulsoup4

      - name: Drop-Radar laufen lassen
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python drops.py

      - name: State committen
        # Auch wenn drops.py rot endet (Telegram hat nicht angenommen): der
        # Zustand ohne die offenen Treffer soll trotzdem gesichert werden.
        if: success() || failure()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor@localhost"
          # gemeldet.json ist das Nachschlagewerk fuer die Bewertungs-Knoepfe.
          # Kollidiert es mit dem Monitor-Workflow, ist das kein Beinbruch:
          # feedback.py liest Shop und Titel dann aus dem Nachrichtentext.
          git add drops_state.json gemeldet.json || true
          git diff --staged --quiet && exit 0
          git commit -m "drops state update"
          # Robust gegen Push-Races mit dem Pokémon-Monitor-Workflow.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main || python3 scripts/state_vereinen.py; then
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "Drops-State-Push nach 5 Versuchen fehlgeschlagen" >&2
          exit 1   # sonst steht der Lauf gruen, obwohl das Gedaechtnis fehlt und der naechste Lauf doppelt meldet
