name: Pokemon 30 Jahre Monitor

on:
  schedule:
    - cron: "*/15 5-19 * * *"   # alle 15 Min, 7:00-21:45 deutscher Zeit (UTC+2). Fenster 7-22 Uhr, Ansage 26.08.2026
  workflow_dispatch:          # manueller Start ueber die Actions-Oberflaeche

permissions:
  contents: write             # noetig, damit state.json zurueckgeschrieben wird

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests beautifulsoup4

      - name: Monitor laufen lassen
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Diese Haendler blocken Cloud-IPs und liefern hier nur leere Listen.
          # Sie laufen ueber den lokalen Mac-Laeufer (scripts/local-monitor.sh).
          # Games Island laeuft aus der Cloud in einen Verbindungs-Timeout,
          # gemessen am 01.09.2026. Vom Mac aus antwortet der Shop normal.
          SOURCES_EXCLUDE: "Amazon.de,MediaMarkt,Saturn,Games Island,MediaMarkt AT,Smyths AT,Geizhals AT"
        run: python monitor.py

      - name: State committen
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor@localhost"
          git add state.json last_run.txt gemeldet.json || true
          git diff --staged --quiet && exit 0
          git commit -m "state update"
          # Robust gegen Push-Races mit dem Drop-Radar-Workflow: rebasen + wiederholen,
          # sonst geht das Gedächtnis verloren und Treffer kommen doppelt.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "State-Push nach 5 Versuchen fehlgeschlagen" >&2
